<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <title>SoundVinyl — Home</title>

  <link th:href="@{/css/base.css}" rel="stylesheet"/>
  <link th:href="@{/css/components.css}" rel="stylesheet"/>
  <link th:href="@{/css/pages/home.css}" rel="stylesheet"/>
</head>

<body>

<div th:replace="~{header.html :: header}"></div>

<main class="page-container stack-lg">

  <h1>Reviews recentes</h1>

  <form method="get" class="cluster" th:action="@{/reviews}">
    <input type="number" name="albumId" min="1" class="form-control"
           placeholder="Filtrar por Album ID" th:value="${param.albumId}" />
    <button class="btn btn-outline">Filtrar</button>
    <a class="btn btn-ghost" th:href="@{/reviews}">Limpar</a>
  </form>

  <section class="stack">
    <h2>Nova Review</h2>
    <form id="rv-create-global" onsubmit="return false;">
      <div class="cluster">
        <label class="form-label">Álbum (ID)</label>
        <input type="number" name="albumId" class="form-control" min="1" th:value="${param.albumId}" required />
      </div>
      <div class="cluster">
        <label class="form-label">Nota</label>
        <input type="number" name="rating" class="form-control" min="0" max="5" step="0.5" required/>
      </div>
      <div class="stack">
        <label class="form-label">Texto</label>
        <textarea name="text" class="form-control" rows="3" placeholder="O que essa música te lembra?"></textarea>
      </div>
      <button class="btn btn-success mt-1">Salvar review</button>
      <span class="text-muted small ms-2" id="rv-create-status"></span>
    </form>
  </section>

  <div class="stack">
    <div th:each="review : ${reviews}" class="card-review">
      <div class="cluster">
        <img th:src="${review.albumCoverUrl}" class="rounded" width="64" height="64" alt="capa"/>
        <div>
          <a th:href="@{/albums/{id}(id=${review.albumId})}"
             th:text="${review.albumTitle}">Álbum</a>
          <div class="text-muted small" th:text="${review.username}">Usuário</div>
        </div>
      </div>

      <div class="mt-2">
        ⭐ <span th:text="${review.rating}">0</span>
      </div>
      <p th:text="${review.text}"></p>

      <div class="cluster mt-2">
        <a href="#" class="btn btn-ghost btn-sm"
           onclick="document.getElementById('rv-edit-'+[loadReviews()]).open = true; return false;">
          Editar
        </a>
        <button class="btn btn-danger btn-sm review-delete-btn"
                th:attr="data-id=${review.reviewId()}, data-album-id=${review.albumId()}">
          Excluir
        </button>
        <span class="text-muted small ms-2 delete-status"></span>
      </div>

      <details class="mt-2" th:id="'rv-edit-' + ${review.reviewId()}">
        <summary>Editar review</summary>
        <form class="review-edit-form" onsubmit="return false;" th:attr="data-id=${review.reviewId()}, data-albumid=${review.albumId()}">
          <div class="cluster">
            <label class="form-label">Nota</label>
            <input class="form-control" type="number" name="rating" min="0" max="5" step="0.5" value="${review.rating()}" required />
          </div>
          <div class="stack">
            <label class="form-label">Texto</label>
            <textarea class="form-control" name="text" rows="3" th:text="${review.text()}"></textarea>
          </div>
          <button class="btn btn-success btn-sm">Salvar</button>
          <span class="text-muted small ms-2 edit-status"></span>
        </form>
      </details>
    </div>
  </div>

</main>


<div th:replace="~{footer.html :: footer}"></div>

</body>
</html>
